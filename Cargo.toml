[package]
name = "weatheroz"
version = "0.1.0"
edition = "2021"
description = "A high-performance parallel weather CLI and TUI application written in Rust."
license = "MIT"
repository = "https://github.com/ozkayhan/weather"
homepage = "https://github.com/ozkayhan/weather"
readme = "README.md"
keywords = ["weather", "cli", "tui", "rust", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
deunicode = "1.3"
ratatui = "0.26"
crossterm = "0.27"
comfy-table = "7.1"
futures-util = "0.3"
urlencoding = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
async-trait = "0.1"

